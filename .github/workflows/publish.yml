name: Publicar entradas

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "angel/*.md"
      - "javi/*.md"
      - "antonio/*.md"
      - "invitados/**/*.md"

  workflow_dispatch:

jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Convertir Markdown → HTML y regenerar posts.js
        run: node scripts/build.js

      - name: Commit y Push
        run: |
          git config user.name "NousArchives Bot"
          git config user.email "bot@nousarchives.github.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "build: publicar entradas [skip ci]"
            git push
          else
            echo "Nada que actualizar."
          fi
