name: Publish posts

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "angel/*.md"
      - "javi/*.md"
      - "antonio/*.md"
      - "invitados/**/*.md"

  workflow_dispatch:

jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Markdown → HTML and regenerate posts.js
        run: node scripts/build.js

      - name: Commit and push
        run: |
          git config user.name "NousArchives Bot"
          git config user.email "bot@nousarchives.github.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "build: publish posts [skip ci]"
            git push
          else
            echo "Nothing to update."
          fi
